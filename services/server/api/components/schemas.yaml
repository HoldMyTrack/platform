Error:
  type: object
  description: Every error the API sends (ADR-0045). A client branches on error, never on message.
  required: [error, message]
  additionalProperties: false
  properties:
    error:
      type: string
      description: >-
        A stable code: a failure's own (photo_no_track), or its status's generic one
        (invalid_request, unauthenticated, forbidden, not_found, conflict, gone, payload_too_large,
        unsupported_type, unprocessable, rate_limited, unavailable, internal).
    message:
      type: string
      description: For a person, in the request's language when the server has it translated.
ActivityRow:
  type: object
  required: [id, started_at, timezone, activity_type, name, distance_meters, duration_seconds, description, bbox, pending, edited, private, split, stories]
  additionalProperties: false
  properties:
    id: { type: string, format: uuid }
    started_at: { type: string, format: date-time }
    timezone:
      type: string
      description: The IANA zone it was recorded in; a client shows its times in it.
    activity_type: { type: string }
    name: { type: string, nullable: true }
    distance_meters: { type: number, nullable: true }
    duration_seconds: { type: integer, nullable: true }
    description: { type: string, nullable: true }
    bbox:
      type: array
      nullable: true
      description: "[minLon, minLat, maxLon, maxLat], or null when the activity has no track."
      minItems: 4
      maxItems: 4
      items: { type: number }
    pending: { type: boolean }
    edited: { type: boolean }
    private: { type: boolean }
    track_edit:
      type: string
      enum: [pending, private, no_original, bad_times]
      description: Why Edit track can't open for this activity (docs/SPEC.md FR-5.14); absent when it can.
    photos:
      type: string
      enum: [private]
      description: Why photos can't be added to it (docs/SPEC.md FR-16.1); absent when they can.
    split:
      type: object
      nullable: true
      required: [group, from, to]
      additionalProperties: false
      properties:
        group: { type: string, format: uuid }
        from: { type: integer, format: int64, nullable: true }
        to: { type: integer, format: int64, nullable: true }
    stories:
      type: array
      items:
        type: object
        required: [id, name]
        additionalProperties: false
        properties:
          id: { type: string, format: uuid }
          name: { type: string }
ActivityTypes:
  type: object
  description: What a client shows for each activity type, keyed by the type as stored (docs/SPEC.md FR-5.1).
  additionalProperties:
    type: object
    required: [kind, label]
    additionalProperties: false
    properties:
      label:
        type: string
        description: >-
          The type's name in the request's language: the catalog's, else the type spaced out
          from snake_case and title-cased.
      kind:
        type: string
        enum: [foot, wheels, motor, solowheel, e_scooter, other]
        description: Picks the icon; foot reads as a pace, every other kind as a speed.
PrivateLocationInput:
  type: object
  required: [lon, lat, radius_m]
  additionalProperties: false
  properties:
    name:
      type: string
      maxLength: 100
      description: Missing or empty leaves the Private location unnamed.
    lon: { type: number, minimum: -180, maximum: 180 }
    lat: { type: number, minimum: -85, maximum: 85 }
    radius_m: { type: integer, minimum: 50, maximum: 2000 }
PrivateLocation:
  type: object
  required: [id, name, lon, lat, radius_m]
  additionalProperties: false
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    lon: { type: number }
    lat: { type: number }
    radius_m: { type: integer }
StoryInput:
  type: object
  required: [name]
  additionalProperties: false
  properties:
    name:
      type: string
      description: Trimmed; blank or longer than 200 characters is a 400.
    description:
      type: string
      description: Trimmed; missing or empty leaves the Story without one. Longer than 2000 characters is a 400.
StoryCreateInput:
  type: object
  required: [name]
  additionalProperties: false
  description: StoryInput, and the Story's first activities.
  properties:
    name: { $ref: "#/StoryInput/properties/name" }
    description: { $ref: "#/StoryInput/properties/description" }
    activity_ids: { $ref: "#/ActivityIDs" }
ActivityIDs:
  type: array
  nullable: true
  maxItems: 10000
  description: Duplicates are ignored; missing or null adds none.
  items: { type: string, format: uuid }
StoryActivitiesInput:
  type: object
  required: [activity_ids]
  additionalProperties: false
  properties:
    activity_ids:
      type: array
      minItems: 1
      maxItems: 10000
      description: Duplicates are ignored.
      items: { type: string, format: uuid }
Story:
  type: object
  required: [id, name, description, created_at, updated_at, from, activity_ids, stats]
  additionalProperties: false
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    description: { type: string, nullable: true }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }
    from:
      type: string
      nullable: true
      description: Who sent the copy this Story came from, while the Story it was copied from still exists; null for the account's own.
    activity_ids:
      type: array
      description: Every member, oldest activity first.
      items: { type: string, format: uuid }
    stats:
      type: object
      description: Joint statistics over every member, with no date bound.
      required: [count, distance_meters, moving_seconds, elapsed_seconds, by_type]
      additionalProperties: false
      properties:
        count: { type: integer }
        distance_meters: { type: number }
        moving_seconds: { type: integer }
        elapsed_seconds: { type: integer }
        by_type:
          type: array
          description: The same per activity type, most frequent first.
          items:
            type: object
            required: [activity_type, label, count, distance_meters, moving_seconds, elapsed_seconds]
            additionalProperties: false
            properties:
              activity_type: { type: string }
              label:
                type: string
                description: The type's name in the request's language.
              count: { type: integer }
              distance_meters: { type: number }
              moving_seconds: { type: integer }
              elapsed_seconds: { type: integer }
UploadResult:
  type: object
  required: [status, external_id, filename]
  additionalProperties: false
  properties:
    status: { type: string, enum: [enqueued, already_processed] }
    external_id:
      type: string
      description: The file's SHA-256, what GET /activities/status/{external_id} takes.
    filename: { type: string }
ActivityStatsBlock:
  type: object
  required: [count, distance_meters, active_days, longest_streak_days]
  additionalProperties: false
  properties:
    count: { type: integer }
    distance_meters: { type: number }
    active_days: { type: integer }
    longest_streak_days: { type: integer }
TrackEdit:
  type: object
  description: Points are addressed by their timestamp, in unix milliseconds.
  additionalProperties: false
  properties:
    keep:
      type: array
      description: "[first, last]: only the points in this range are kept."
      minItems: 2
      maxItems: 2
      items: { type: integer }
    remove:
      type: array
      description: "[first, last] ranges of points removed."
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: integer }
    drop:
      type: array
      description: Single points removed.
      items: { type: integer }
    move:
      type: object
      description: Moved points, keyed by timestamp, to [lon, lat].
      additionalProperties:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number }
Photo:
  type: object
  required: [id, activity_id, taken_at, route_at, timezone, lon, lat, caption, width, height, url, thumb_url]
  additionalProperties: false
  properties:
    id: { type: string, format: uuid }
    activity_id: { type: string, format: uuid }
    taken_at:
      type: string
      format: date-time
      nullable: true
      description: When the camera says it was taken; null when it didn't say.
    route_at:
      type: string
      format: date-time
      description: Its moment on the track, which places it there.
    timezone:
      type: string
      description: The activity's IANA zone; a client shows the photo's times in it.
    lon:
      type: number
      nullable: true
      description: Its position on the track at route_at; null when the activity has no track.
    lat: { type: number, nullable: true }
    caption: { type: string, nullable: true }
    width: { type: integer }
    height: { type: integer }
    url:
      type: string
      description: The image, a path under the API.
    thumb_url: { type: string }
Credentials:
  type: object
  required: [email, password]
  additionalProperties: false
  properties:
    email: { type: string }
    password:
      type: string
      description: A password shorter than the minimum or longer than the maximum is a 400.
    timezone:
      type: string
      description: The browser's IANA zone, for a new account; anything invalid falls back to UTC.
Account:
  type: object
  required: [email, isDemo, email_verified, display_name, country, avatar_url, timezone, locale]
  additionalProperties: false
  properties:
    email:
      type: string
      description: Empty for the demo.
    isDemo: { type: boolean }
    email_verified:
      type: boolean
      description: Always true for the demo.
    display_name:
      type: string
      description: Empty when unset, like country and avatar_url.
    country: { type: string }
    avatar_url: { type: string }
    timezone: { type: string }
    locale:
      type: string
      description: Empty for automatic.
AccountWithSession:
  type: object
  required: [session_token, email, isDemo, email_verified, display_name, country, avatar_url, timezone, locale]
  additionalProperties: false
  description: The Account, and the session's token.
  properties:
    session_token:
      type: string
      description: The session cookie's value, for a client with no cookie jar to send as a bearer token.
    email:
      type: string
      description: Empty for the demo.
    isDemo: { type: boolean }
    email_verified:
      type: boolean
      description: Always true for the demo.
    display_name:
      type: string
      description: Empty when unset, like country and avatar_url.
    country: { type: string }
    avatar_url: { type: string }
    timezone: { type: string }
    locale:
      type: string
      description: Empty for automatic.
SettingsOption:
  type: object
  required: [value, label]
  additionalProperties: false
  properties:
    value: { type: string }
    label: { type: string }
ExportStatus:
  type: object
  required: [state]
  additionalProperties: false
  properties:
    state: { type: string, enum: [none, preparing, ready, failed] }
    id: { type: string, format: uuid }
    requested_at: { type: string, format: date-time }
    expires_at:
      type: string
      format: date-time
      description: Only when ready, like total_size and parts.
    total_size: { type: integer }
    parts:
      type: array
      items:
        type: object
        required: [n, size, name, url]
        additionalProperties: false
        properties:
          n: { type: integer }
          size: { type: integer }
          name:
            type: string
            description: The file it downloads as.
          url:
            type: string
            description: Relative to the site.
SyncSource:
  type: string
  enum: [healthconnect, healthkit, recorded]
SyncExternalID:
  type: string
  pattern: "^[A-Za-z0-9_-][A-Za-z0-9._-]{0,199}$"
  description: The source's own id for the activity.
Spot:
  type: object
  required: [id, category, lon, lat]
  additionalProperties: false
  description: A place; each text field is missing when the map data has none.
  properties:
    id: { type: integer }
    category: { type: string, enum: [playground, dog_park, monument, viewpoint, history] }
    name: { type: string }
    address: { type: string }
    description: { type: string }
    inscription: { type: string }
    memorial: { type: string }
    start_date: { type: string }
    wikipedia: { type: string }
    lon: { type: number }
    lat: { type: number }
SpotCapture:
  type: object
  required: [spot_id, captured_at]
  additionalProperties: false
  properties:
    spot_id: { type: integer }
    captured_at: { type: string, format: date-time }
MapLayers:
  type: object
  description: Every layer drawn over the basemap (IMPLEMENTATION.md §4.2, ADR-0048), for the client to apply as it comes. Every view sets the same properties, so switching views never undoes one.
  required: [styleBuild, flavor, tileVersion, tiers, vars, views, groups]
  additionalProperties: false
  properties:
    styleBuild: { type: string, description: "The build it came from; a style naming another is fetched again." }
    flavor: { type: string }
    tileVersion: { type: string, description: "The account's tile version, already in every tile path." }
    tiers:
      type: array
      description: The zoom tiers Fog draws at, in order; a tier is in view below its `below`, the last at every zoom past.
      items:
        type: object
        required: [tier]
        additionalProperties: false
        properties:
          tier: { type: string, enum: [country, region, city] }
          below: { type: number }
    vars:
      type: object
      description: "By name, the default of each value a layer reads as [\"var\", name]; the client binds its own with let."
    views:
      type: object
      description: The layout and paint the document's layers and the basemap's label layers take in each mode, over satellite imagery or not.
      required: [plain, satellite]
      additionalProperties: false
      properties:
        plain: { $ref: "#/LayerViews" }
        satellite: { $ref: "#/LayerViews" }
    groups:
      type: array
      description: In paint order within each placement.
      items: { $ref: "#/LayerGroup" }
LayerGroup:
  type: object
  required: [id, placement, sources, layers]
  additionalProperties: false
  properties:
    id: { type: string }
    placement: { type: string, enum: [beneath-labels, top], description: "Beneath the basemap's first label layer, or over everything." }
    lifts:
      type: array
      description: Basemap layers moved up to the group's place, beneath its own layers.
      items: { type: string }
    sources:
      type: object
      description: By source id.
      additionalProperties:
        oneOf:
          - type: object
            required: [type, tiles, minzoom, maxzoom]
            additionalProperties: false
            properties:
              type: { type: string, enum: [vector] }
              tiles: { type: string, description: "A path on the API's origin with {z}/{x}/{y} and the tile version; the client adds its base URL, and its own query where it keeps one." }
              minzoom: { type: integer }
              maxzoom: { type: integer }
              attribution: { type: string }
          - type: object
            required: [type]
            additionalProperties: false
            properties:
              type: { type: string, enum: [geojson], description: "Filled by the client." }
    layers:
      type: array
      description: "MapLibre layers in paint order. Every array in a filter, layout or paint value is an expression. Metadata `holdmytrack:toggle` names the Layers menu switch that shows a layer; `holdmytrack:vars` the properties, or `filter`, that read vars."
      items: { type: object, required: [id, type] }
    legend:
      type: object
      description: By Layers menu entry, the line its legend draws.
      additionalProperties:
        type: object
        required: [color]
        additionalProperties: false
        properties:
          color: { type: string }
          dash: { type: array, items: { type: number }, description: "In line widths; none for a solid line." }
LayerViews:
  type: object
  required: [normal, fog, heatmap]
  additionalProperties: false
  properties:
    normal: { $ref: "#/LayerView" }
    fog: { $ref: "#/LayerView" }
    heatmap: { $ref: "#/LayerView" }
LayerView:
  type: object
  required: [layout, paint]
  additionalProperties: false
  properties:
    layout: { type: object, description: "By layer id, the layout properties to set." }
    paint: { type: object, description: "By layer id, the paint properties to set." }
