trips:
  get:
    summary: The signed-in account's Trips, newest first, each with its members and statistics
    responses:
      "200":
        description: The Trips
        content:
          application/json:
            schema:
              type: object
              required: [trips]
              additionalProperties: false
              properties:
                trips:
                  type: array
                  items: { $ref: "../components/schemas.yaml#/Trip" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/NotVerified" }
  post:
    summary: Create a Trip, optionally with its first tracks
    description: Any track that isn't the caller's own fails the whole request with a 404 and creates nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/TripCreateInput" }
    responses:
      "201":
        description: The new Trip
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/Trip" }
      "400": { $ref: "../components/responses.yaml#/Error" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
trips_id:
  parameters:
    - $ref: "../components/parameters.yaml#/TripID"
  get:
    summary: One of the signed-in account's Trips
    responses:
      "200":
        description: The Trip
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/Trip" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/NotVerified" }
      "404": { $ref: "../components/responses.yaml#/Error" }
  patch:
    summary: Rename a Trip or change its description (a full replace)
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/TripInput" }
    responses:
      "200":
        description: The Trip as saved
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/Trip" }
      "400": { $ref: "../components/responses.yaml#/Error" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
  delete:
    summary: Delete a Trip; its tracks stay
    responses:
      "204":
        description: Deleted
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
trips_id_tracks:
  parameters:
    - $ref: "../components/parameters.yaml#/TripID"
  post:
    summary: Add tracks to a Trip
    description: One already in the Trip is left as it is; one that isn't the caller's own fails the whole request with a 404 and adds nothing.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/TripTracksInput" }
    responses:
      "200":
        description: The Trip as saved
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/Trip" }
      "400": { $ref: "../components/responses.yaml#/Error" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
  delete:
    summary: Take tracks out of a Trip; an id not in it is ignored, and the tracks stay
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/TripTracksInput" }
    responses:
      "200":
        description: The Trip as saved
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/Trip" }
      "400": { $ref: "../components/responses.yaml#/Error" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
trips_id_send:
  parameters:
    - $ref: "../components/parameters.yaml#/TripID"
  post:
    summary: Send a copy of a Trip to another account by email address
    description: 204 whether or not the address belongs to an account that can receive it, so the answer doesn't tell the sender who has an account.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: { type: string }
    responses:
      "204":
        description: Sent, or silently not
      "400": { $ref: "../components/responses.yaml#/Error" }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
      "429": { $ref: "../components/responses.yaml#/Error" }
trip-sends:
  get:
    summary: Copies of Trips waiting for the signed-in account, newest first, and accepted ones still being copied
    responses:
      "200":
        description: The waiting and arriving copies
        content:
          application/json:
            schema:
              type: object
              required: [sends, copying]
              additionalProperties: false
              properties:
                sends:
                  type: array
                  items:
                    type: object
                    required: [id, trip_name, from, sent_at, track_count]
                    additionalProperties: false
                    properties:
                      id: { type: string, format: uuid }
                      trip_name: { type: string }
                      from:
                        type: string
                        description: The sender's name, or their email address when they've set none.
                      sent_at: { type: string, format: date-time }
                      track_count: { type: integer }
                copying:
                  type: array
                  items:
                    type: object
                    required: [trip_name, from]
                    additionalProperties: false
                    properties:
                      trip_name: { type: string }
                      from: { type: string }
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/NotVerified" }
trip-sends_id_accept:
  parameters:
    - $ref: "../components/parameters.yaml#/TripSendID"
  post:
    summary: Accept a copy; the Trip arrives once its copy job has run
    responses:
      "202":
        description: Accepted, copy queued
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
      "409": { $ref: "../components/responses.yaml#/OverLimit" }
      "503": { $ref: "../components/responses.yaml#/DailyCapacity" }
trip-sends_id:
  parameters:
    - $ref: "../components/parameters.yaml#/TripSendID"
  delete:
    summary: Decline a copy; nothing is copied
    responses:
      "204":
        description: Declined
      "401": { $ref: "../components/responses.yaml#/Unauthenticated" }
      "403": { $ref: "../components/responses.yaml#/Forbidden" }
      "404": { $ref: "../components/responses.yaml#/Error" }
