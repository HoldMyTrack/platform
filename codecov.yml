# Codecov settings for .github/workflows/ci.yml's coverage uploads: Go (flag `go`), the
# Android app's Kotlin (flag `kotlin`) and the web app's TypeScript (flag `typescript`); and
# ios.yml's of the iOS app's Swift, its package and its app target (flag `swift`).
# Coverage is reported, not enforced: this project verifies most behavior live rather than
# through unit tests (docs/DEVELOPMENT.md, "Verification"), so a percentage threshold would
# gate on the wrong thing. Both status checks stay informational and never block a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# ios.yml, and ci.yml's go, web and android jobs, run only on changes to what they read, so a
# commit one skips keeps that flag's last report instead of reading as no coverage.
flags:
  go:
    carryforward: true
  kotlin:
    carryforward: true
  typescript:
    carryforward: true
  swift:
    carryforward: true

# No PR comment: the badges, the status checks and codecov.io carry the numbers, and a comment
# on every PR only added a notification email each time.
comment: false

# Paths are reported relative to the repo root; the Go module lives in services/server,
# JaCoCo reports the Android sources by package path alone, and c8 reports the web app's
# relative to apps/web. llvm-cov writes absolute paths, under the runner's checkout.
fixes:
  - "/Users/runner/work/platform/platform/::"
  - "github.com/HoldMyTrack/platform/services/server/::services/server/"
  - "dev/holdmytrack/android/::apps/android/holdmytrack/app/src/main/kotlin/dev/holdmytrack/android/"
  - "src/::apps/web/src/"

# Not product code: dev tools, a generator and test helpers. The web's generated apiSchema.ts
# is left out by apps/web/.c8rc.json.
ignore:
  - services/server/cmd/delayproxy
  - services/server/cmd/loadtest
  - services/server/cmd/make-testing-files
  - services/server/internal/web/gentimezones
  - services/server/internal/storage/storagetest
  - services/server/internal/tilemath/tilemathtest
