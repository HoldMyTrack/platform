# Runs the checks that already exist (docs/DEVELOPMENT.md's verification checklist) on every
# push and pull request. CI only: nothing here deploys. Auto-deploy is deliberately gated on
# backups existing first (docs/ROADMAP.md, "CI on push/PR").
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token reads the repository and nothing else; no job here writes to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every commit on main is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doc-refs:
    name: Document citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-doc-refs.sh

  file-size:
    name: File size (soft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Annotations only (scripts/check-file-size.sh always exits 0). A pull request is compared
      # with its base branch, a push with the commit before it.
      - run: scripts/check-file-size.sh "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"

  security:
    name: Known vulnerabilities and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      # Fails only on a vulnerability the server's code can reach, in a module or the stdlib.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: services/server
      # The binary, not gitleaks-action, which needs a paid license on an organization's repo;
      # checked against the release's published SHA-256 before it runs.
      - run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  # What otherwise fails first on the server: a shell script's bug at 03:17, a Caddyfile or
  # production compose file that doesn't parse, a web image that doesn't build.
  ops-config:
    name: Shell scripts, Caddyfile, production compose, web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # apps/web/scripts/build-basemap.sh is left out: the e2e job's basemap cache is keyed on
      # its hash, so an edit made to quiet a warning would cut a fresh basemap.
      - run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -S warning scripts/*.sh scripts/lib/*.sh apps/ios/scripts/*.sh
      - run: docker compose -f compose.prod.yml --env-file .env.prod.example config -q
      - run: >-
          docker run --rm -v "$PWD/apps/web/docker/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e DOMAIN=example.com -e REDIRECT_DOMAINS= caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build --target serve apps/web

  go:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/server
    # The tests that need Postgres+PostGIS (internal/httpapi's dbtest_test.go) skip without
    # TEST_DATABASE_URL; this gives them one.
    services:
      postgres:
        image: postgis/postgis:16-3.6
        env:
          POSTGRES_USER: holdmytrack
          POSTGRES_PASSWORD: holdmytrack
          POSTGRES_DB: holdmytrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U holdmytrack"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://holdmytrack:holdmytrack@localhost:5432/holdmytrack_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/server/go.mod
          cache-dependency-path: services/server/go.sum
      # One package at a time: the database tests share one database, and the worker's claim
      # takes any runnable job in it, another package's included (docs/DEVELOPMENT.md).
      - run: go test -p 1 -coverprofile=coverage.out ./...
      # Coverage of the Go unit tests only: the Playwright suites exercise far more of the
      # server but aren't instrumented. Informational (codecov.yml), never a merge gate, and
      # an upload failure doesn't fail the build.
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: services/server/coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}

  web:
    name: Web typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # test:unit under c8, which counts every file in src, not only the ones a test imports.
      - run: npm run test:coverage
      - run: npm run verify:style
      # apiSchema.ts is generated from the API contract; a contract change regenerates it.
      - run: npm run verify:api-types
      # What ships to browsers; dev-server advisories are left to Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: apps/web/coverage/lcov.info
          flags: typescript
          token: ${{ secrets.CODECOV_TOKEN }}

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android/holdmytrack
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner's preinstalled Android SDK (ANDROID_HOME) has its licenses accepted, so
      # AGP downloads whatever platform compileSdk names that isn't there yet.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :app:createDebugUnitTestCoverageReport
      # JaCoCo coverage of the JUnit tests in app/src/test, under its own `kotlin` flag so
      # the README's Kotlin badge reads it apart from Go's. Informational, like Go's.
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: apps/android/holdmytrack/app/build/reports/coverage/test/debug/report.xml
          flags: kotlin
          token: ${{ secrets.CODECOV_TOKEN }}

  # `make verify verify-build`: the whole dev stack (db, rustfs, migrate, api) plus headless
  # Chromium, exactly as it runs locally.
  e2e:
    name: Map verification (make verify, verify-build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A stand-in imagery host, so tests/smoke.mjs's step 9 checks satellite mode rather than
    # its absence; the test answers the tiles itself.
    env:
      SATELLITE_TILES: https://imagery.invalid/{z}/{x}/{y}.png
    steps:
      - uses: actions/checkout@v7
      # The basemap extract is gitignored and cut from a dated Protomaps build that the
      # bucket only keeps for about a week (apps/web/scripts/build-basemap.sh). Keyed on
      # that script, so bumping its BUILD pin or bbox cuts a fresh one; a cache miss after
      # the pinned build has aged out fails here with a 404, and the fix is bumping BUILD.
      - uses: actions/cache@v6
        id: basemap
        with:
          path: apps/web/public/basemap/basemap.pmtiles
          key: basemap-${{ hashFiles('apps/web/scripts/build-basemap.sh') }}
      - if: steps.basemap.outputs.cache-hit != 'true'
        run: make basemap
      - run: make verify verify-build
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: apps/web/tests/screenshots/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs api migrate
