# Runs the iOS package's tests, then builds the app and runs its unit tests (apps/ios/docs/ROADMAP.md,
# 3.4 and 4.0), when a change touches the app, the shared rule cases it implements, the API
# contract its wire models follow, or the web and Android files its palette, fonts and icons are
# made from, Markdown aside. Its own workflow, not a job in ci.yml, so the path filter keeps the
# macOS runner off every other pull request. On a pull request the filter is a job, as in ci.yml,
# not the trigger's paths: a required check skipped by its `if` passes, while one whose workflow
# never starts leaves the pull request waiting. The UI tests need the dev stack, which this runner
# doesn't have, so they run before a release instead (`make e2e-ios`, docs/DEVELOPMENT.md).
name: iOS

on:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - testdata/client-rules/**
      - services/server/api/**
      # What scripts/make-design.py reads.
      - services/server/internal/web/static/tokens.css
      - apps/android/holdmytrack/app/src/main/res/drawable/**
      - apps/android/holdmytrack/app/src/main/res/font/**
      - apps/android/holdmytrack/app/src/main/assets/licenses/**
      - .github/workflows/ios.yml
      # Documentation alone builds nothing.
      - '!**/*.md'
  pull_request:
  # Every night on main, and from Actions → iOS → Run workflow: every step, whatever
  # changed, so a dependency the path filter misses fails within a day.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# The token reads the repository and nothing else; no job here writes to it.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # A newer push to a pull request replaces its run; every commit on main is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # True on a pull request that touches a file the tests read, the push trigger's list; always
  # true on main, at night and on a manual run.
  changes:
    name: Changed paths (iOS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios }}
    steps:
      # Reads a pull request's changed files from the API, so it needs no checkout.
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            ios:
              - '{apps/ios/**,testdata/client-rules/**,services/server/api/**,services/server/internal/web/static/tokens.css,apps/android/holdmytrack/app/src/main/res/drawable/**,apps/android/holdmytrack/app/src/main/res/font/**,apps/android/holdmytrack/app/src/main/assets/licenses/**,.github/workflows/ios.yml}'
              - '!**/*.md'

  ios:
    name: iOS unit tests
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count (scripts/stamp-build.sh).
          fetch-depth: 0
      # MapLibre's binary framework, about 100 MB, fetched again only when the pin changes.
      - uses: actions/cache@v6
        with:
          path: ~/spm
          key: spm-${{ hashFiles('apps/ios/HoldMyTrack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # The palette, scales, fonts and icons are written from the web's and Android's files.
      - name: Design files up to date
        run: scripts/make-design.py --check
      # Which compiled strings the translation check counts (scripts/check-strings.py).
      - name: Script tests
        working-directory: apps/ios/scripts
        run: python3 -m unittest test_check_strings
      # The package needs no simulator, so a broken rule fails here in seconds.
      - name: Package tests
        working-directory: apps/ios/HoldMyTrackCore
        run: swift test --enable-code-coverage
      # Coverage is informational (codecov.yml): an export that fails warns, never failing the
      # job. The test bundle's name differs between Swift releases, so it is found rather than named.
      - name: Package coverage
        id: pkgcov
        working-directory: apps/ios/HoldMyTrackCore
        run: |
          bin=$(swift build --show-bin-path)
          xctest=$(find "$bin" -maxdepth 1 -name '*.xctest' | head -1)
          if [ -n "$xctest" ] && xcrun llvm-cov export -format=lcov "$xctest/Contents/MacOS/$(basename "$xctest" .xctest)" \
            -instr-profile "$bin/codecov/default.profdata" -ignore-filename-regex='/(Tests|\.build)/' > coverage.lcov; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::llvm-cov couldn't export the package's coverage"
          fi
      # The runner's simulator names change with each image, so take its newest iOS's last iPhone.
      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries | sort_by(.key)[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project HoldMyTrack.xcodeproj -scheme HoldMyTrack \
            -destination "id=${{ steps.sim.outputs.udid }}" -only-testing:HoldMyTrackTests \
            -clonedSourcePackagesDirPath ~/spm -derivedDataPath "$RUNNER_TEMP/dd" -enableCodeCoverage YES | tail -n 100
      # Coverage of the app target's own files; HoldMyTrackCore's come from the package tests
      # above, so each file is measured once. A Debug build keeps the app's code in a debug dylib
      # beside a stub executable, or in the executable when that split is off. A missing profile
      # or binary warns, as the package's export does.
      - name: App coverage
        id: appcov
        run: |
          dd="$RUNNER_TEMP/dd"
          app="$dd/Build/Products/Debug-iphonesimulator/HoldMyTrack.app"
          binary="$app/HoldMyTrack.debug.dylib"
          [ -f "$binary" ] || binary="$app/HoldMyTrack"
          profdata=$(find "$dd/Build/ProfileData" -name Coverage.profdata 2>/dev/null | head -1)
          if [ -z "$profdata" ] || [ ! -f "$binary" ]; then
            echo "::warning::No app coverage: profile '${profdata:-none}', binary '$binary'"
            exit 0
          fi
          if xcrun llvm-cov export -format=lcov "$binary" -instr-profile "$profdata" \
            -ignore-filename-regex='/(HoldMyTrackCore|HoldMyTrackTests|HoldMyTrackUITests|DerivedSources)/' > app-coverage.lcov; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::llvm-cov couldn't export the app's coverage"
          fi
      # The package's and the app's lines together under the `swift` flag, as Kotlin's cover the
      # whole Android app. Only both: one alone would read as the whole app's figure, while
      # skipping the upload carries the last full one forward (codecov.yml).
      - if: steps.pkgcov.outputs.ready == 'true' && steps.appcov.outputs.ready == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: apps/ios/HoldMyTrackCore/coverage.lcov,apps/ios/app-coverage.lcov
          flags: swift
          token: ${{ secrets.CODECOV_TOKEN }}
