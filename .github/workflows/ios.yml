# Runs the iOS package's tests, then builds the app and runs its unit tests, and on main its UI tests (apps/ios/docs/ROADMAP.md,
# 3.4 and 4.0) when a change touches
# the app, the shared rule cases it implements, the API contract its wire models follow, or the
# web and Android files its palette, fonts and icons are made from. Its
# own workflow, not a job in ci.yml, so the path filter keeps the macOS runner off every other
# pull request.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - testdata/client-rules/**
      - services/server/api/**
      # What scripts/make-design.py reads.
      - services/server/internal/web/static/tokens.css
      - apps/android/holdmytrack/app/src/main/res/drawable/**
      - apps/android/holdmytrack/app/src/main/res/font/**
      - apps/android/holdmytrack/app/src/main/assets/licenses/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/ios/**
      - testdata/client-rules/**
      - services/server/api/**
      # What scripts/make-design.py reads.
      - services/server/internal/web/static/tokens.css
      - apps/android/holdmytrack/app/src/main/res/drawable/**
      - apps/android/holdmytrack/app/src/main/res/font/**
      - apps/android/holdmytrack/app/src/main/assets/licenses/**
      - .github/workflows/ios.yml

# The token reads the repository and nothing else; no job here writes to it.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  # A newer push to a pull request replaces its run; every commit on main is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count (scripts/stamp-build.sh).
          fetch-depth: 0
      # MapLibre's binary framework, about 100 MB, fetched again only when the pin changes.
      - uses: actions/cache@v6
        with:
          path: ~/spm
          key: spm-${{ hashFiles('apps/ios/HoldMyTrack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      # The palette, scales, fonts and icons are written from the web's and Android's files.
      - name: Design files up to date
        run: scripts/make-design.py --check
      # The package needs no simulator, so a broken rule fails here in seconds. The test
      # bundle's name differs between Swift releases, so it is found rather than named.
      - name: Package tests
        working-directory: apps/ios/HoldMyTrackCore
        run: |
          swift test --enable-code-coverage
          bin=$(swift build --show-bin-path)
          xctest=$(find "$bin" -maxdepth 1 -name '*.xctest' | head -1)
          xcrun llvm-cov export -format=lcov "$xctest/Contents/MacOS/$(basename "$xctest" .xctest)" \
            -instr-profile "$bin/codecov/default.profdata" -ignore-filename-regex='/(Tests|\.build)/' > coverage.lcov
      # Under its own `swift` flag, carried forward on runs this workflow skips (codecov.yml).
      # Informational, like the other uploads.
      - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: apps/ios/HoldMyTrackCore/coverage.lcov
          flags: swift
          token: ${{ secrets.CODECOV_TOKEN }}
      # The runner's simulator names change with each image, so take its newest iOS's last iPhone.
      - name: Pick a simulator
        id: sim
        run: |
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries | sort_by(.key)[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test -project HoldMyTrack.xcodeproj -scheme HoldMyTrack \
            -destination "id=${{ steps.sim.outputs.udid }}" -only-testing:HoldMyTrackTests \
            -clonedSourcePackagesDirPath ~/spm | tail -n 100
      # The end-to-end flows (HoldMyTrackUITests), which need no server. Slower than the unit
      # tests, so on main only: a launch regression shows up there, not on every pull request.
      - name: UI tests
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          xcodebuild test -project HoldMyTrack.xcodeproj -scheme HoldMyTrack \
            -destination "id=${{ steps.sim.outputs.udid }}" -only-testing:HoldMyTrackUITests \
            -clonedSourcePackagesDirPath ~/spm | tail -n 100
