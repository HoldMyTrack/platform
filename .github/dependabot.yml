# Weekly version updates, one grouped pull request per ecosystem (docs/DEVELOPMENT.md, "CI").
# Security updates arrive on their own as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/server
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  # The group takes minor and patch updates only, so a major version arrives as its own pull
  # request. The serialization plugin sets the app's Kotlin compiler (libs.versions.toml), so it
  # always does. The ignored ones are pinned on purpose there, each with its reason; patches and
  # security fixes still come.
  - package-ecosystem: gradle
    directory: /apps/android/holdmytrack
    schedule: { interval: weekly }
    groups:
      gradle:
        patterns: ["*"]
        exclude-patterns: ["org.jetbrains.kotlin.plugin.serialization"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: androidx.recyclerview:recyclerview
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: androidx.fragment:fragment
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: androidx.test.uiautomator:uiautomator
        versions: ["2.4.x"]
  - package-ecosystem: swift
    directory: /apps/ios/HoldMyTrackCore
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/services/server, /apps/web]
    schedule: { interval: weekly }
    groups: { docker: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  # compose.yaml and compose.prod.yml, one pull request per image. A postgis/postgis pull request is the signal to run
  # docs/DEPLOY.md §9, never one to merge alone: a new tag changes the OS under the data, and a
  # new Postgres major can't open it at all.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
