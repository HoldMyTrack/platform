# Weekly version updates, one grouped pull request per ecosystem (docs/DEVELOPMENT.md, "CI").
# A group takes minor and patch updates only, so a major version arrives as its own pull
# request. Security updates arrive on their own as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/server
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"], update-types: [minor, patch] } }
  # The serialization plugin sets the app's Kotlin compiler (libs.versions.toml), so it always
  # arrives on its own. The ignored ones are pinned on purpose there, each with its reason; patches and
  # security fixes still come.
  - package-ecosystem: gradle
    directory: /apps/android/holdmytrack
    schedule: { interval: weekly }
    groups:
      gradle:
        patterns: ["*"]
        exclude-patterns: ["org.jetbrains.kotlin.plugin.serialization"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: androidx.recyclerview:recyclerview
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: androidx.fragment:fragment
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # A Maven range: Dependabot reads Gradle versions in Maven's syntax, not as wildcards.
      - dependency-name: androidx.test.uiautomator:uiautomator
        versions: ["[2.4,2.5)"]
  - package-ecosystem: swift
    directory: /apps/ios/HoldMyTrackCore
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: [/services/server, /apps/web]
    schedule: { interval: weekly }
    groups: { docker: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"], update-types: [minor, patch] } }
  # compose.yaml and compose.prod.yml, one pull request per image. A postgis/postgis pull request
  # is the signal to run docs/DEPLOY.md §9, never one to merge alone: a new tag changes the OS
  # under the data. A new Postgres major can't open the data directory at all, which is a dump
  # and restore, so those aren't proposed.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: postgis/postgis
        update-types: ["version-update:semver-major"]
