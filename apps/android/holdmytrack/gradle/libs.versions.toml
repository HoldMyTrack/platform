[versions]
agp = "9.4.1"
# MapLibre Native for Android. 11.8.0 is where built-in `pmtiles://` support landed and
# 13.3.0 added its ambient cache, so anything in the 13.x line already speaks the same URL
# scheme the style document carries (docs/ARCHITECTURE.md §3).
maplibre = "13.7.1"
appcompat = "1.8.0"
# Material Components for Android — the Material 3 theme and widgets the Views UI is styled
# with (docs/ARCHITECTURE.md §3). The theme was built against 1.13.0; 1.14.0 passed the
# emulator flows (src/androidTest) unchanged.
material = "1.14.0"
# The Health Connect client (Path 2's on-device read). 1.1.0 is the current stable; 1.2.0 is
# alpha only, and the device measurements of this platform's behaviour
# (docs/IMPLEMENTATION.md §4.0) ran against 1.1.0, so the app ships against the same API
# surface those findings were observed on.
healthConnect = "1.1.0"
lifecycle = "2.9.4"
coroutines = "1.11.0"
# Declared explicitly rather than inherited transitively: the app builds its own OkHttpClient
# (net/HoldMyTrackApi.kt) and hands that same instance to MapLibre Native, so the version is a
# direct compile dependency here, not an implementation detail of the map SDK. It outranks the
# 4.12.0 MapLibre 13.7.1's POM asks for; the emulator flows draw the map through it. From 5.5.0
# the project lives at github.com/lysine-dev/okhttp (square/okhttp redirects there), still
# published as com.squareup.okhttp3.
okhttp = "5.5.1"
# Sign in with Google (docs/IMPLEMENTATION.md §4.9): Credential Manager's account picker,
# its Play services backend, and the Google ID-token credential type it returns.
credentials = "1.6.0"
# 1.2.1 is compiled with Kotlin 2.4 metadata, which needs the compiler `kotlin` sets.
googleId = "1.2.1"
# Custom Tabs, for Sign in with Facebook through the server's own web flow in a browser tab —
# instead of Meta's SDK (docs/IMPLEMENTATION.md §4.9).
browser = "1.10.0"
# The map's Activities panel list (panel/ActivitiesPanel.kt) — declared rather than borrowed
# from Material's own dependency on it, at the version Material 1.14.0 already resolves to,
# so this pins rather than upgrades.
recyclerview = "1.2.1"
# The map is a Fragment in MainActivity (apps/android/docs/IMPLEMENTATION.md §1.3)
# — declared rather than borrowed from AppCompat and Material, at the version they already
# resolve to, so this pins rather than upgrades.
fragment = "1.8.9"
# Unit tests for the panel's pure logic (src/test).
junit = "4.13.2"
# `kotlin` is the app's Kotlin compiler, not only the serialization plugin's version: the plugin
# puts the Kotlin Gradle plugin at this version on the build classpath, where it outranks AGP's
# built-in one (2.2.10 in AGP 9.4). Change it on purpose, never as a plugin bump in passing.
# The serialization runtime (net/Wire.kt's bodies) and googleId need a compiler at least as new
# as the Kotlin they were built with.
kotlin = "2.4.21"
serialization = "1.12.0"
# The test that holds net/Wire.kt to the API contract reads services/server/api's YAML.
snakeyaml = "2.7"
# The end-to-end flows on an emulator (src/androidTest): AndroidX Test's runner and JUnit 4
# rules, and UI Automator to drive the app as a person does.
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"
# Not 2.4.0: its UiDevice.swipe no longer drags the Sync sheet open by its handle, so
# MapFlowsTest.c_aStoppedRecordingReachesTheSyncSheet never reaches the new walk's row.
uiautomator = "2.4.0"

[libraries]
maplibre = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
junit = { module = "junit:junit", version.ref = "junit" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
