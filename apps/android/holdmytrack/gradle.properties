org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Where the app reaches HoldMyTrack, baked into BuildConfig.API_BASE_URL at build time:
# apiBaseUrl for debug builds, releaseApiBaseUrl for release (the Play build). Debug talks to the
# web's dev server on the host, which serves the site's pages and the API from one origin, as
# production does, so the pages' forms save (docs/DEVELOPMENT.md). The emulator, or a phone over
# USB, reaches it through `adb reverse`, which every debug build sets up (app/build.gradle.kts).
# For the API alone, without the web: -Pholdmytrack.apiBaseUrl=http://10.0.2.2:8080
holdmytrack.apiBaseUrl=http://localhost:5173
holdmytrack.releaseApiBaseUrl=https://holdmytrack.com
